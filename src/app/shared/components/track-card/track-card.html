@if (track()) {
<article class="track-card" [routerLink]="['/trackDetail', track().trackId]">
  <button type="button" class="track-options-btn" (click)="toggleOptionsMenu($event)">
    <span></span>
    <span></span>
    <span></span>
  </button>

  @if (isMenuOpen) {
  <div class="track-options-menu" (click)="stopCardNavigation($event)">
    <button
      type="button"
      (click)="isTrackInLibrary() ? removeFromLibrary($event) : addToLibrary($event)"
    >
      {{ isTrackInLibrary() ? 'Eliminar de biblioteca' : 'Anadir a biblioteca' }}
    </button>
    <button type="button" (click)="createPlaylistAndAddTrack($event)">Crear lista y guardar</button>
    <p>Guardar en lista</p>

    @if (playlistService.playlists().length === 0) {
    <span class="empty-menu">Primero crea una lista en "Mis listas".</span>
    } @else {
    @for (list of playlistService.playlists(); track list.id) {
    <button
      type="button"
      (click)="addToPlaylist($event, list.id)"
      [disabled]="isTrackInPlaylist(list.id)"
    >
      {{ isTrackInPlaylist(list.id) ? list.name + ' (ya esta)' : list.name }}
    </button>
    }
    }
  </div>
  }

  <div class="artwork-container">
    <img [src]="track().artworkUrl100" alt="Artwork for {{ track().trackName }}" />

    <button class="play-btn" (click)="togglePlay($event)">
      @if (!isPlaying) {
      <!-- PLAY -->
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
      } @else {
      <!-- PAUSE -->
      <svg viewBox="0 0 24 24">
        <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
      </svg>
      }
    </button>
  </div>

  <h3>{{ track().trackName }}</h3>
  <p>{{ track().artistName }}</p>
</article>
}
